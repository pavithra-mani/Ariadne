services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ariadne
      POSTGRES_PASSWORD: ariadne
      POSTGRES_DB: ariadne
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariadne"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://ariadne:ariadne@postgres:5432/ariadne
      CHROMA_PATH: /data/chroma
      ALLOW_DEMO_RESET: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - chroma:/data/chroma
      - modelcache:/root/.cache/chroma

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  chroma:
  modelcache:
